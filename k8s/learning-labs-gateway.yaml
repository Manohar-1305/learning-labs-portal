
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: learning-labs-gateway
  namespace: learning-labs
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: learninglabs.study
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: learning-labs-route
  namespace: learning-labs
spec:
  parentRefs:
    - name: learning-labs-gateway
  hostnames:
    - learninglabs.study
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: learning-labs
          port: 5000
